<div id="subtree-components">
  <h2>Subtree size and removal components</h2>
  <div class="viz-controls">
    <label class="form-label">Current node u
      <select class="form-select" id="tree-node">
        <option value="1">1 (root)</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option>
      </select>
    </label>
    <label class="form-check"><input class="form-check-input" id="tree-remove" type="checkbox"><span class="form-check-label">Remove current node</span></label>
  </div>
  <svg id="tree-picture" role="img" aria-label="Four-node tree rooted at 1"></svg>
  <div id="tree-values" class="viz-row tabular-nums" aria-live="polite"></div>
  <div id="tree-detail" class="text-small" aria-live="polite"></div>
  <style>
    #subtree-components #tree-picture { display:block; width:100%; height:300px; }
    #subtree-components .tree-label { fill:var(--foreground); }
    #subtree-components #tree-values { gap:24px; margin:12px 0; }
    #subtree-components #tree-detail { margin-top:12px; }
  </style>
  <script>
  (() => {
    const root = document.getElementById('subtree-components');
    const picker = root.querySelector('#tree-node');
    const removal = root.querySelector('#tree-remove');
    const svg = root.querySelector('#tree-picture');
    const edges = [[1,2],[2,3],[2,4]];
    const children = {1:[2],2:[3,4],3:[],4:[]};
    const subtree = u => [u,...children[u].flatMap(subtree)];
    function draw() {
      const u = Number(picker.value), removed = removal.checked;
      const members = subtree(u);
      const groups = children[u].map(v => ({name:`Child ${v}`,nodes:subtree(v)}));
      const outside = [1,2,3,4].filter(v => !members.includes(v));
      if (outside.length) groups.push({name:'Parent side',nodes:outside});
      const maxPart = Math.max(0,...groups.map(g => g.nodes.length));
      const w = svg.getBoundingClientRect().width || 320;
      svg.setAttribute('viewBox',`0 0 ${w} 300`);
      const points = {1:[w/2,42],2:[w/2,139],3:[w*.25,250],4:[w*.75,250]};
      const mark = (tag, attrs, text) => {
        const el = document.createElementNS('http://www.w3.org/2000/svg',tag);
        for (const [k,v] of Object.entries(attrs)) el.setAttribute(k,v);
        if (text !== undefined) el.textContent = text;
        svg.appendChild(el); return el;
      };
      svg.replaceChildren();
      mark('title',{},`Rooted tree: 1–2, 2–3, 2–4. Current node ${u}${removed?' removed':''}. Subtree size ${members.length}; largest remaining component ${maxPart}.`);
      for (const [a,b] of edges) {
        if (removed && (a===u || b===u)) continue;
        mark('line',{x1:points[a][0],y1:points[a][1],x2:points[b][0],y2:points[b][1],stroke:'var(--border)','stroke-width':2});
      }
      for (const v of [1,2,3,4]) {
        const [x,y] = points[v];
        const index = groups.findIndex(g => g.nodes.includes(v));
        const fill = removed ? (v===u?'var(--muted)':`var(--viz-series-${index+1})`) : (members.includes(v)?'var(--viz-series-1)':'var(--muted)');
        mark('circle',{cx:x,cy:y,r:24,fill,'fill-opacity':.23,stroke:v===u?'var(--foreground)':'none','stroke-width':2});
        mark('text',{x,y:y+5,'text-anchor':'middle',class:'tree-label'},v);
        if (removed && v===u) mark('line',{x1:x-17,y1:y-17,x2:x+17,y2:y+17,stroke:'var(--foreground)','stroke-width':2});
        if (removed && v!==u) mark('text',{x,y:y+42,'text-anchor':'middle',class:'tree-label'},groups[index].name);
      }
      root.querySelector('#tree-values').textContent = `sum = ${members.length}    ·    maxPart = ${maxPart}    ·    DFS returns ${members.length}`;
      root.querySelector('#tree-detail').textContent = removed
        ? groups.map(g => `${g.name}: {${g.nodes.join(', ')}} (${g.nodes.length})`).join(' · ')
        : `Subtree of ${u}: {${members.join(', ')}} · Outside subtree: ${outside.length} · n = 4`;
    }
    function restore(state) {
      const s = state?.modelContent;
      if (s && [1,2,3,4].includes(s.node)) { picker.value=String(s.node); removal.checked=!!s.removed; }
      draw();
    }
    function change() {
      draw();
      window.openai?.setWidgetState?.({modelContent:{node:Number(picker.value),removed:removal.checked},privateContent:null})?.catch(()=>{});
    }
    picker.addEventListener('change',change);
    removal.addEventListener('change',change);
    window.addEventListener('openai:set_globals', e => { if (e.detail?.globals?.widgetState) restore(e.detail.globals.widgetState); });
    new ResizeObserver(draw).observe(svg);
    restore(window.openai?.widgetState);
  })();
  </script>
</div>
